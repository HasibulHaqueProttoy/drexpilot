services:
  - type: web
    name: postpilot-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Dhaka
      - key: MCP_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
